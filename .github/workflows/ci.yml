# Typecheck, lint, unit tests, evals and a production build on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blackbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d blackbox"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blackbox?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      # Evals upload to LangSmith only when the secret exists.
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - name: Evals (quality gates)
        run: |
          if [ -n "$LANGSMITH_API_KEY" ]; then npm run eval:langsmith; else npm run eval; fi
      - name: RAG faithfulness and relevance (needs GEMINI_API_KEY)
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run eval:rag
      - run: npm run build
