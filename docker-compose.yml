# Local PostgreSQL for development.
#   docker compose up -d
# Matches the default DATABASE_URL in frontend/.env.example.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blackbox
      # UTF-8 matters: the question bank contains non-ASCII characters.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - blackbox-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blackbox"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  blackbox-pg:
